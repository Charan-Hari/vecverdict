name: tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Results must hold across architectures, since SIMD kernels and HNSW graph
# construction both vary by platform.
jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ["3.10", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[turbovec,faiss,chroma,viz,dev]"

      - name: Lint
        run: ruff check src tests

      - name: Test
        run: pytest -q

      - name: Verify no secrets are committed
        run: detect-secrets scan --all-files src tests README.md pyproject.toml

  # The demo is the first thing a visitor runs; a break here is user-facing.
  demo:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e ".[turbovec,faiss,viz]"
      - run: vecverdict demo --n 5000 --dim 64 --k 10
